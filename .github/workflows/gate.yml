name: gate
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
# Nothing by default; each job asks for exactly what it needs.
permissions: {}
concurrency:
  group: gate
  cancel-in-progress: false
jobs:
  gate:
    runs-on: ubuntu-latest
    # Each PR fetch is bounded (120 s, 64 MiB; one over either is labelled needs-human and not fetched again), so a run
    # is short; this caps a run that is not.
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
    steps:
      # Full history: a learner belongs to the author of the PR that first put its logs on main (github.ts boundAuthor).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: gate
        run: npx tsx tools/gate/gate.ts data/runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
  # Merges made with GITHUB_TOKEN do not trigger other workflows, so the gate calls deploy itself.
  deploy:
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.merged != '' && needs.gate.outputs.merged != '0' }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
