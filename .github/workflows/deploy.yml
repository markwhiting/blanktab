name: deploy
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Explicit main: when called from the gate, github.sha predates the merges just made.
      # Full history: codeSha is the last commit that changed code, which may be far behind main's head.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The code, not the commit: the last commit that changed a build input (app, packages, the root package files,
      # tsconfig.base.json, config/evaluation.json: tools/gate/manifest.ts BUILD_INPUTS). The page bakes it in, the manifest carries it, every log records it.
      - id: sha
        run: |
          sha=$(npx tsx tools/gate/manifest.ts --code-sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "no code commit found: $sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Build app
        run: npm run build -w app
        env:
          CODE_SHA: ${{ steps.sha.outputs.sha }}
      - name: Assemble knowledge/ (summary and manifest are generated here, never committed)
        run: |
          mkdir -p app/dist/knowledge
          cp knowledge/*.json app/dist/knowledge/
          npx tsx tools/gate/summary-cli.ts data/runs app/dist/knowledge/summary.json
          npx tsx tools/gate/manifest.ts knowledge app/dist/knowledge/manifest.json
        env:
          CODE_SHA: ${{ steps.sha.outputs.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
